<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f7f8fa" />
  <title>五色反应练习</title>
  <style>
    :root {
      --ink: #17181b;
      --muted: #73767d;
      --line: #e5e7eb;
      --panel: rgba(255, 255, 255, .82);
      --yellow: #f5cf3b;
      --green: #4fbd73;
      --blue: #4b8df8;
      --purple: #9b6df4;
      --black: #202226;
      --shadow: 0 20px 55px rgba(29, 35, 48, .11);
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: #f7f8fa;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    button { font: inherit; }

    .app {
      width: min(100%, 980px);
      min-height: 100vh;
      margin: 0 auto;
      padding: clamp(20px, 4vw, 40px) clamp(16px, 5vw, 48px) 28px;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 24px;
    }

    .eyebrow {
      margin: 0 0 6px;
      color: var(--muted);
      font-size: 12px;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(24px, 4vw, 34px);
      line-height: 1.15;
      letter-spacing: .02em;
    }

    .subline {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    .mode-nav {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: flex-end;
      padding: 3px;
      border-radius: 16px;
      background: rgba(235, 237, 241, .7);
    }

    .mode-btn {
      border: 0;
      border-radius: 12px;
      padding: 10px 15px;
      color: #5d6068;
      background: transparent;
      cursor: pointer;
      transition: background .2s ease, color .2s ease, transform .2s ease;
      white-space: nowrap;
    }

    .mode-btn:hover { transform: translateY(-1px); }
    .mode-btn:focus-visible, .control-btn:focus-visible { outline: 3px solid rgba(75, 141, 248, .35); outline-offset: 2px; }

    .mode-btn.active {
      color: #fff;
      background: var(--ink);
    }

    .stage {
      position: relative;
      flex: 1;
      min-height: min(68vh, 650px);
      display: grid;
      place-items: center;
      overflow: hidden;
      border-radius: 28px;
      background: var(--panel);
      isolation: isolate;
    }

    .orb-wrap {
      position: relative;
      width: min(48vw, 300px);
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      transition: transform 1.1s cubic-bezier(.22, .8, .26, 1), opacity .55s ease;
    }

    .orb {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: var(--yellow);
      transition: background .7s ease, transform .8s cubic-bezier(.23, .94, .34, 1), box-shadow .7s ease;
      will-change: transform, background;
    }

    .orb-wrap.hidden { opacity: 0; transform: scale(.35); visibility: hidden; pointer-events: none; }

    .finish {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      opacity: 0;
      transform: translateY(10px) scale(.96);
      pointer-events: none;
      transition: opacity .45s ease, transform .45s ease;
    }

    .finish.visible { opacity: 1; transform: translateY(0) scale(1); }

    .finish strong {
      display: block;
      font-size: clamp(44px, 10vw, 88px);
      letter-spacing: .08em;
    }

    .finish span {
      display: block;
      margin-top: 12px;
      color: var(--muted);
      text-align: center;
      font-size: 14px;
    }

    .countdown {
      position: absolute;
      left: 50%;
      bottom: clamp(20px, 5vw, 48px);
      color: #d4d7dc;
      font-size: clamp(88px, 18vw, 178px);
      font-weight: 800;
      line-height: .85;
      letter-spacing: -.08em;
      transform: translateX(-50%);
      opacity: 0;
      transition: opacity .3s ease, color .5s ease;
      user-select: none;
      pointer-events: none;
    }

    .countdown:not(.visible) { display: none; }

    .countdown.visible { opacity: .9; }

    .countdown.bump { animation: countBump .55s ease both; }

    @keyframes countBump {
      0% { transform: translateX(-50%) scale(.82); opacity: .2; }
      55% { transform: translateX(-50%) scale(1.08); opacity: 1; }
      100% { transform: translateX(-50%) scale(1); opacity: .9; }
    }

    .controls {
      display: flex;
      justify-content: center;
      gap: 12px;
      padding-top: 24px;
    }

    .control-btn {
      min-width: 120px;
      border: 0;
      border-radius: 14px;
      padding: 13px 20px;
      cursor: pointer;
      transition: transform .2s ease, box-shadow .2s ease, background .2s ease;
    }

    .control-btn:hover { transform: translateY(-2px); }
    .control-btn:active { transform: translateY(0); }

    .control-btn.primary {
      color: #fff;
      background: var(--ink);
    }

    .control-btn.secondary {
      color: #565a62;
      background: #e8eaed;
    }

    .control-btn[disabled] { opacity: .48; cursor: not-allowed; transform: none; box-shadow: none; }

    @media (max-width: 700px) {
      .app { padding-top: 18px; }
      .topbar { display: block; margin-bottom: 16px; }
      .mode-nav { justify-content: flex-start; margin-top: 16px; overflow-x: auto; flex-wrap: nowrap; }
      .mode-btn { flex: 0 0 auto; }
      .stage { min-height: 68vh; border-radius: 22px; }
      .orb-wrap { width: min(56vw, 260px); }
      .meta { top: 14px; left: 16px; right: 16px; }
      .controls { padding-top: 16px; padding-bottom: max(0px, env(safe-area-inset-bottom)); }
      .control-btn { flex: 1; max-width: 170px; min-width: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div>
        <p class="eyebrow">COLOR RHYTHM · 5 × 3 SEC</p>
        <h1 id="modeTitle">固定模式</h1>
        <p class="subline">按下开始，跟随五种颜色的节奏。</p>
      </div>
      <nav class="mode-nav" aria-label="选择模式">
        <button class="mode-btn active" data-mode="fixed" type="button">固定</button>
        <button class="mode-btn" data-mode="bounce" type="button">跳动</button>
        <button class="mode-btn" data-mode="countdown" type="button">倒计时</button>
      </nav>
    </header>

    <section class="stage" id="stage" aria-live="polite">
      <div class="orb-wrap" id="orbWrap">
        <div class="orb" id="orb" aria-label="颜色圆球"></div>
      </div>
      <div class="countdown" id="countdown" aria-hidden="true">5</div>
      <div class="finish" id="finish" aria-hidden="true">
        <div>
          <strong>结束！</strong>
          <span>点击“开始”再次体验</span>
        </div>
      </div>
    </section>

    <div class="controls">
      <button class="control-btn primary" id="startBtn" type="button">开始</button>
      <button class="control-btn secondary" id="resetBtn" type="button">归零</button>
    </div>
  </main>

  <script>
    (() => {
      const colors = [
        { name: '黄色', value: '#f5cf3b' },
        { name: '绿色', value: '#4fbd73' },
        { name: '蓝色', value: '#4b8df8' },
        { name: '紫色', value: '#9b6df4' },
        { name: '黑色', value: '#202226' }
      ];
      const modes = {
        fixed: { title: '固定模式' },
        bounce: { title: '跳动模式' },
        countdown: { title: '倒计时模式' }
      };
      const positions = [
        { x: -25, y: -18, scale: .82 },
        { x: 25, y: 15, scale: 1.2 },
        { x: -18, y: 25, scale: .94 },
        { x: 21, y: -19, scale: 1.1 },
        { x: 0, y: 0, scale: .88 }
      ];

      const modeTitle = document.getElementById('modeTitle');
      const modeButtons = [...document.querySelectorAll('.mode-btn')];
      const orb = document.getElementById('orb');
      const orbWrap = document.getElementById('orbWrap');
      const finish = document.getElementById('finish');
      const countdown = document.getElementById('countdown');
      const startBtn = document.getElementById('startBtn');
      const resetBtn = document.getElementById('resetBtn');

      let mode = 'fixed';
      let colorTimer = null;
      let motionTimer = null;
      let finishTimer = null;
      let step = 0;
      let motionStep = 0;
      let running = false;

      function setOrb(colorIndex) {
        const color = colors[colorIndex];
        orb.style.background = color.value;
        orb.setAttribute('aria-label', `${color.name}圆球`);
        if (mode === 'countdown') {
          countdown.textContent = String(colors.length - colorIndex);
          countdown.style.color = colorIndex === colors.length - 1 ? '#c9ccd2' : '#d4d7dc';
          countdown.classList.remove('bump');
          void countdown.offsetWidth;
          countdown.classList.add('bump');
        }
      }

      function applyMotion() {
        if (mode !== 'bounce' && mode !== 'countdown') {
          orb.style.transform = 'translate(0, 0) scale(1)';
          return;
        }
        const p = positions[motionStep % positions.length];
        orb.style.transform = `translate(${p.x}vw, ${p.y}vh) scale(${p.scale})`;
        motionStep += 1;
      }

      function showFinish() {
        running = false;
        colorTimer = null;
        motionTimer = null;
        orbWrap.classList.add('hidden');
        countdown.classList.remove('visible');
        countdown.setAttribute('aria-hidden', 'true');
        finishTimer = window.setTimeout(() => {
          finish.classList.add('visible');
          finish.setAttribute('aria-hidden', 'false');
          startBtn.textContent = '再来一次';
          startBtn.disabled = false;
          finishTimer = null;
        }, 650);
      }

      function reset() {
        if (colorTimer) window.clearInterval(colorTimer);
        if (motionTimer) window.clearInterval(motionTimer);
        if (finishTimer) window.clearTimeout(finishTimer);
        colorTimer = null;
        motionTimer = null;
        finishTimer = null;
        running = false;
        step = 0;
        motionStep = 0;
        orbWrap.classList.remove('hidden');
        finish.classList.remove('visible');
        finish.setAttribute('aria-hidden', 'true');
        countdown.classList.toggle('visible', mode === 'countdown');
        countdown.setAttribute('aria-hidden', mode === 'countdown' ? 'false' : 'true');
        startBtn.disabled = false;
        startBtn.textContent = '开始';
        orb.style.transform = 'translate(0, 0) scale(1)';
        orb.style.background = colors[0].value;
        countdown.textContent = '5';
        countdown.style.color = '#d4d7dc';
        countdown.classList.remove('bump');
      }

      function start() {
        if (running) return;
        reset();
        running = true;
        startBtn.disabled = true;
        setOrb(0);
        if (mode === 'bounce' || mode === 'countdown') {
          motionTimer = window.setInterval(applyMotion, 1000);
        }
        colorTimer = window.setInterval(() => {
          step += 1;
          if (step >= colors.length) {
            window.clearInterval(colorTimer);
            if (motionTimer) window.clearInterval(motionTimer);
            colorTimer = null;
            motionTimer = null;
            showFinish();
            return;
          }
          setOrb(step);
        }, 3000);
      }

      function switchMode(nextMode) {
        if (mode === nextMode) return;
        mode = nextMode;
        modeTitle.textContent = modes[mode].title;
        modeButtons.forEach((button) => {
          const active = button.dataset.mode === mode;
          button.classList.toggle('active', active);
          button.setAttribute('aria-pressed', String(active));
        });
        reset();
      }

      modeButtons.forEach((button) => {
        button.setAttribute('aria-pressed', button.classList.contains('active') ? 'true' : 'false');
        button.addEventListener('click', () => switchMode(button.dataset.mode));
      });
      startBtn.addEventListener('click', start);
      resetBtn.addEventListener('click', reset);
      reset();
    })();
  </script>
</body>
</html>
